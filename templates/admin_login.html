<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Nail Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FAFAF9; --fg: #1C1917; --muted: #A8A29E; --accent: #C2956B;
      --accent-soft: #EDE4DB; --white: #FFFFFF; --border: #E7E5E4;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --font: 'Outfit', -apple-system, sans-serif; --radius: 6px;
      --danger: #DC2626; --danger-bg: #FEF2F2;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; align-items: center; justify-content: center; -webkit-font-smoothing: antialiased; }
    .login-card { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 2.5rem; width: 100%; max-width: 380px; box-shadow: var(--shadow-md); }
    .login-header { text-align: center; margin-bottom: 2rem; }
    .login-logo { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3em; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
    .login-sub { font-size: 0.8rem; color: var(--muted); }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.4rem; }
    .form-input { width: 100%; padding: 0.6rem 0.85rem; border: 1px solid var(--border); background: var(--bg); font-family: var(--font); font-size: 0.85rem; color: var(--fg); border-radius: var(--radius); outline: none; transition: all 0.2s; }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(194,149,107,0.1); }
    .btn { width: 100%; padding: 0.7rem; background: var(--fg); color: var(--white); border: none; font-family: var(--font); font-size: 0.85rem; font-weight: 600; border-radius: var(--radius); cursor: pointer; transition: all 0.2s; }
    .btn:hover { opacity: 0.9; }
    .error { background: var(--danger-bg); color: var(--danger); padding: 0.6rem 0.85rem; border-radius: var(--radius); font-size: 0.8rem; margin-bottom: 1.25rem; }
    .back-link { display: block; text-align: center; margin-top: 1.25rem; font-size: 0.8rem; color: var(--muted); text-decoration: none; }
    .back-link:hover { color: var(--fg); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo"><div class="logo-dot"></div> Nail Studio</div>
      <div class="login-sub">Admin Dashboard</div>
    </div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" required>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
    <a href="/" class="back-link">Back to catalog</a>
  </div>
</body>
</html>
