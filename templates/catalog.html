    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

      --accent: #C2956B; --accent-soft: #EDE4DB; --white: #FFFFFF; --border: #E7E5E4;
      --wa-green: #25D366; --wa-dark: #128C7E;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
      --font: 'Outfit', -apple-system, sans-serif; --radius: 6px;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--fg); height: 100vh; overflow: hidden; display: flex; -webkit-font-smoothing: antialiased; }

    .sidebar > * { position: relative; z-index: 1; }
    .sidebar-header { padding: 2rem 1.5rem 1rem; }
    .logo { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3em; color: var(--fg); display: flex; align-items: center; gap: 0.5rem; }
    .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
    .sidebar-tagline { font-size: 0.7rem; color: var(--muted); margin-top: 0.35rem; }
    .sidebar-nav { padding: 0 0.75rem; flex: 1; }
    .nav-label { font-size: 0.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); padding: 1.5rem 0.75rem 0.5rem; }
    .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; font-size: 0.85rem; color: var(--muted); cursor: pointer; transition: all 0.2s; border-radius: var(--radius); }
    .nav-item:hover { color: var(--fg); background: rgba(0,0,0,0.03); }
    .nav-item.active { color: var(--fg); font-weight: 500; background: var(--white); box-shadow: var(--shadow-sm); }
    .nav-item svg { width: 16px; height: 16px; opacity: 0.4; flex-shrink: 0; }
    .nav-item.active svg { opacity: 0.8; }
    .nav-count { margin-left: auto; font-size: 0.65rem; color: var(--muted); font-weight: 500; background: rgba(0,0,0,0.04); padding: 0.15rem 0.5rem; border-radius: 100px; }
    .nav-item.active .nav-count { background: var(--accent-soft); color: var(--accent); }
    .sidebar-divider { height: 1px; background: var(--border); margin: 0.5rem 1.25rem; }
    .sidebar-footer { padding: 1.25rem; border-top: 1px solid var(--border); }
    .wa-link { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.65rem 1rem; background: var(--wa-green); color: #fff; text-decoration: none; font-size: 0.8rem; font-weight: 600; border-radius: var(--radius); transition: all 0.2s; box-shadow: var(--shadow-sm); }
    .wa-link:hover { background: var(--wa-dark); transform: translateY(-1px); }
    .wa-link svg { width: 16px; height: 16px; }
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
    .main::before { content: ''; position: absolute; top: -120px; right: -120px; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(194,149,107,0.18) 0%, transparent 70%); pointer-events: none; }
    .main::after { content: ''; position: absolute; bottom: -80px; left: 20%; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(194,149,107,0.12) 0%, transparent 70%); pointer-events: none; }
    .main > * { position: relative; z-index: 1; }
    .ornaments { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orn { position: absolute; opacity: 0.25; }
    .orn-1 { top: 15%; right: 8%; width: 200px; height: 200px; border: 2px solid var(--accent); border-radius: 50%; animation: float-slow 20s ease-in-out infinite; }
    .orn-2 { top: 60%; right: 15%; width: 120px; height: 120px; border: 2px solid var(--accent); border-radius: 50%; animation: float-slow 25s ease-in-out infinite reverse; }
    .orn-3 { top: 30%; left: 45%; width: 80px; height: 80px; background: var(--accent); border-radius: 50%; animation: float-slow 18s ease-in-out infinite; }
    .orn-4 { bottom: 20%; right: 30%; width: 140px; height: 140px; border: 2px solid var(--accent); transform: rotate(45deg); animation: float-slow 22s ease-in-out infinite reverse; }
    .orn-5 { top: 45%; left: 10%; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; animation: float-slow 15s ease-in-out infinite; }
    @keyframes float-slow { 0%,100%{transform:translate(0,0)} 25%{transform:translate(10px,-15px)} 50%{transform:translate(-5px,10px)} 75%{transform:translate(8px,5px)} }
    .grid-wrap { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; scroll-behavior: smooth; position: relative; }
    .grid-wrap::before { content: ''; position: fixed; top: 0; right: 0; bottom: 0; left: 272px; background-image: radial-gradient(circle at 1px 1px, rgba(28,25,23,0.08) 1px, transparent 0); background-size: 24px 24px; pointer-events: none; }
    .topbar { padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--white); gap: 1rem; }
    .topbar-left { display: flex; align-items: center; gap: 0.75rem; }
    .topbar h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.02em; }
    .topbar-count { font-size: 0.7rem; color: var(--muted); font-weight: 500; background: var(--bg); padding: 0.2rem 0.6rem; border-radius: 100px; }
    .topbar-right { display: flex; align-items: center; gap: 0.75rem; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
    .search { padding: 0.5rem 0.85rem 0.5rem 2.25rem; border: 1px solid var(--border); background: var(--bg); font-family: var(--font); font-size: 0.8rem; color: var(--fg); width: 220px; outline: none; border-radius: var(--radius); transition: all 0.2s; }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(194,149,107,0.1); }
    .view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .view-btn { padding: 0.45rem 0.65rem; background: var(--white); border: none; cursor: pointer; color: var(--muted); transition: all 0.15s; }
    .view-btn:hover { color: var(--fg); }
    .view-btn.active { background: var(--fg); color: var(--white); }
    .view-btn svg { width: 14px; height: 14px; display: block; }
    .cta-banner { margin: 1rem 2rem 0; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .cta-inner { display: flex; align-items: center; padding: 1rem 1.25rem; gap: 1rem; }
    .cta-icon-wrap { width: 44px; height: 44px; background: var(--accent-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .cta-icon-wrap svg { width: 20px; height: 20px; color: var(--accent); }
    .cta-body { flex: 1; min-width: 0; }
    .cta-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.1rem; }
    .cta-sub { font-size: 0.75rem; color: var(--muted); line-height: 1.4; }
    .cta-wa-btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; background: var(--wa-green); color: #fff; text-decoration: none; font-size: 0.75rem; font-weight: 600; border-radius: var(--radius); transition: all 0.2s; }
    .cta-wa-btn:hover { background: var(--wa-dark); }
    .cta-wa-btn svg { width: 14px; height: 14px; }
    .content { flex: 1; display: flex; overflow: hidden; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; }
    .grid.list-view { grid-template-columns: 1fr; gap: 0.75rem; }
    .card { background: var(--white); border: 1px solid var(--border); cursor: pointer; transition: all 0.25s; overflow: hidden; border-radius: var(--radius); position: relative; }
    .card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(194,149,107,0.2); }
    .card-badge { position: absolute; top: 0.6rem; left: 0.6rem; background: var(--accent); color: #fff; font-size: 0.55rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.2rem 0.5rem; border-radius: 3px; z-index: 2; }
    .card-img { width: 100%; aspect-ratio: 1; background: var(--accent-soft); overflow: hidden; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
    .card:hover .card-img img { transform: scale(1.05); }
    .card-info { padding: 0.85rem 1rem; }
    .card-cat { font-size: 0.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 0.3rem; }
    .card-name { font-size: 0.9rem; font-weight: 500; margin-bottom: 0.2rem; line-height: 1.3; }
    .card-price { font-size: 0.85rem; font-weight: 600; }
    .grid.list-view .card { display: flex; align-items: stretch; }
    .grid.list-view .card-img { width: 100px; min-width: 100px; aspect-ratio: 1; }
    .grid.list-view .card-info { display: flex; align-items: center; gap: 1rem; flex: 1; }
    .grid.list-view .card-name { margin-bottom: 0; }
    .no-results { display: none; text-align: center; padding: 4rem 2rem; color: var(--muted); }
    .no-results svg { width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.3; }
    .detail { width: 380px; min-width: 380px; border-left: 1px solid var(--border); background: var(--white); overflow-y: auto; display: none; flex-direction: column; }
    .detail.open { display: flex; }
    .detail-img { width: 100%; aspect-ratio: 4/3; background: var(--accent-soft); overflow: hidden; position: relative; }
    .detail-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .detail-close { position: absolute; top: 0.75rem; right: 0.75rem; background: rgba(255,255,255,0.9); border: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; box-shadow: var(--shadow-sm); }
    .detail-body { padding: 1.5rem; flex: 1; }
    .detail-body .cat { font-size: 0.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 0.5rem; }
    .detail-body h2 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.75rem; }
    .detail-body .desc { font-size: 0.85rem; color: var(--muted); line-height: 1.7; margin-bottom: 1.25rem; }
    .detail-meta { display: flex; flex-direction: column; gap: 0.65rem; padding: 1rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; }
    .meta-row { display: flex; justify-content: space-between; font-size: 0.8rem; }
    .meta-label { color: var(--muted); }
    .meta-value { font-weight: 500; }
    .detail-price { font-size: 1.75rem; font-weight: 700; margin-bottom: 1.25rem; }
    .detail-wa { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: var(--wa-green); color: #fff; text-decoration: none; font-size: 0.85rem; font-weight: 600; border-radius: var(--radius); transition: all 0.2s; box-shadow: var(--shadow-sm); }
    .detail-wa:hover { background: var(--wa-dark); transform: translateY(-1px); }
    .detail-wa svg { width: 16px; height: 16px; }
    .mobile-toggle { display: none; background: none; border: 1px solid var(--border); padding: 0.4rem 0.6rem; cursor: pointer; border-radius: var(--radius); }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 299; }
    .sidebar-overlay.active { display: block; }
    @media (max-width: 900px) {
      body { flex-direction: column; overflow: hidden; }
      .sidebar { position: fixed; left: -300px; top: 0; height: 100vh; z-index: 300; transition: left 0.3s cubic-bezier(0.16,1,0.3,1); width: 280px; }
      .sidebar.open { left: 0; box-shadow: var(--shadow-lg); }
      .mobile-toggle { display: flex; }
      .detail { position: fixed; right: 0; top: 0; height: 100vh; width: 100vw; z-index: 301; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); }
      .detail.open { transform: translateX(0); }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; }
      .grid-wrap { padding: 1rem; }
      .topbar { padding: 0.75rem 1rem; }
      .view-toggle, .topbar-count { display: none; }
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
      .card-info { padding: 0.6rem 0.75rem; }
    }
  </style>
</head>

            <div class="meta-row"><span class="meta-label">Durasi</span><span class="meta-value" id="d-durasi"></span></div>
            <div class="meta-row"><span class="meta-label">Ketahanan</span><span class="meta-value" id="d-tahan"></span></div>
            <div class="meta-row"><span class="meta-label">Kategori</span><span class="meta-value" id="d-cat2"></span></div>
          </div>
          <div class="detail-price" id="d-price"></div>
          <a href="#" id="d-wa" class="detail-wa">
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Booking via WhatsApp
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    let allDesigns = [];
    let activeCat = 'all';

    // Load from API
    async function loadDesigns() {
      try {
        const resp = await fetch('/api/designs');
        allDesigns = await resp.json();
        renderSidebar();
        filterCards();
      } catch (e) {
        console.error('Failed to load designs:', e);
      }
    }

    function renderSidebar() {
      const cats = {};
      allDesigns.forEach(d => { cats[d.category] = (cats[d.category] || 0) + 1; });
      document.getElementById('allCount').textContent = allDesigns.length;

      const catNav = document.getElementById('catNav');
      catNav.innerHTML = '';
      const icons = {
        'Gel Polish': '<circle cx="12" cy="12" r="10"/>',
        'Acrylic': '<polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/>',
        'French Tips': '<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
        'Nail Art': '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>',
        'Minimalis': '<line x1="5" y1="12" x2="19" y2="12"/>'
      };
      Object.entries(cats).forEach(([cat, count]) => {
        const el = document.createElement('div');
        el.className = 'nav-item';
        el.dataset.cat = cat;
        el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${icons[cat] || '<circle cx="12" cy="12" r="10"/>'}</svg>${cat}<span class="nav-count">${count}</span>`;
        el.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          el.classList.add('active');
          activeCat = cat;
          filterCards();
          if (window.innerWidth <= 900) toggleSidebar();
        });
        catNav.appendChild(el);
      });

      // All button
      document.querySelector('[data-cat="all"]').onclick = () => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.querySelector('[data-cat="all"]').classList.add('active');
        activeCat = 'all';
        filterCards();
        if (window.innerWidth <= 900) toggleSidebar();
      };
    }

    function filterCards() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      let visible = 0;

      allDesigns.forEach(d => {
        const matchSearch = !q || d.name.toLowerCase().includes(q) || d.category.toLowerCase().includes(q) || d.description.toLowerCase().includes(q);
        const matchCat = activeCat === 'all' || d.category === activeCat;
        if (!matchSearch || !matchCat) return;

        visible++;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${d.badge ? `<span class="card-badge">${d.badge}</span>` : ''}
          <div class="card-img"><img src="${d.image_url || 'https://picsum.photos/seed/placeholder/300/300'}" alt="${d.name}" loading="lazy"></div>
          <div class="card-info">
            <div class="card-cat">${d.category}</div>
            <div class="card-name">${d.name}</div>
            <div class="card-price">${d.price_formatted}</div>
          </div>
        `;
        card.addEventListener('click', () => openDetail(d));
        grid.appendChild(card);
      });

      document.getElementById('visibleCount').textContent = `${visible} desain`;
      document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
    }

    function openDetail(d) {
      document.getElementById('d-cat').textContent = d.category;
      document.getElementById('d-cat2').textContent = d.category;
      document.getElementById('d-title').textContent = d.name;
      document.getElementById('d-desc').textContent = d.description;
      document.getElementById('d-price').textContent = d.price_formatted;
      document.getElementById('d-durasi').textContent = d.duration;
      document.getElementById('d-tahan').textContent = d.durability;
      document.getElementById('d-img').src = d.image_url || 'https://picsum.photos/seed/placeholder/500/375';
      const t = encodeURIComponent(d.name);
      document.getElementById('d-wa').href = `https://wa.me/6281234567890?text=Halo%2C%20saya%20mau%20booking%20${t}`;
      document.getElementById('detail').classList.add('open');
    }

    function closeDetail() {
      document.getElementById('detail').classList.remove('open');
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function setView(mode) {
      const grid = document.getElementById('grid');
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-view="${mode}"]`).classList.add('active');
      grid.classList.toggle('list-view', mode === 'list');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
    loadDesigns();
  </script>
</body>
</html>
